# Deploy SEVN Admin frontend (static) to GitHub Pages
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Give GITHUB_TOKEN permission to publish the Pages site
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the static admin app is served from Pages.
          path: frontend/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
